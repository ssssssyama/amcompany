# デモアプリ用プロジェクト設定
# app.html をローカルサーバーで配信して使用する
#   python -m http.server 8080 --directory demo/

environment:
  base_url: "http://localhost:8080/app.html"

  variables:
    test_user: "testuser"
    test_pass: "password123"
    admin_user: "admin"
    admin_pass: "admin123"

# 認証はアプリ内のフォームで行うため none
auth:
  type: none

browser:
  viewport:
    width: 1280
    height: 720
  locale: "ja-JP"
  timeout: 10000
  ignore_https_errors: false

excel:
  data_start_row: 7
  date_cell: "B3"

test:
  on_fail: abort

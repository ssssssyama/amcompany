# デモアプリ用プロジェクト設定
# Flask サーバーで配信: python demo/server.py

environment:
  base_url: "http://localhost:5000"

  variables:
    test_user: "testuser"
    test_pass: "password123"
    admin_user: "admin"
    admin_pass: "admin123"

# 認証はアプリ内のフォームで行うため none
auth:
  type: none

browser:
  viewport:
    width: 1280
    height: 720
  locale: "ja-JP"
  timeout: 10000
  ignore_https_errors: false

excel:
  data_start_row: 7
  date_cell: "B3"

test:
  on_fail: abort

# DB検証設定（SQLiteを直接使用）
db:
  type: sqlite
  path: "demo/demo.db"
